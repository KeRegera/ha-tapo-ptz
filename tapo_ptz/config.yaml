name: Tapo PTZ
version: "1.0.0"
slug: tapo_ptz
description: Einfache Schwenk-/Neigesteuerung, Positionen und Zeitpläne für Tapo-Kameras (z. B. TC70)
url: https://github.com/KeRegera/ha-tapo-ptz
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: Tapo PTZ
homeassistant_api: true
options:
  cameras:
    - name: Wohnzimmer
      host: 192.168.0.50
      username: admin
      password: ""
      entity_id: camera.wohnzimmer_hd_stream
schema:
  cameras:
    - name: str
      host: str
      username: str
      password: password
      cloud_password: password?
      entity_id: str?
